<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1060 205" font-family="Helvetica, Arial, sans-serif">
  <title>5 switches in cascade, 4 links of 10 ms: RTT about 80 ms</title>
  <defs>
    <linearGradient id="swTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#2585c9"/></linearGradient>
    <linearGradient id="swFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/></linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7fc4"/></marker>
    <symbol id="switch" viewBox="-55 -30 110 60" overflow="visible">
      <path d="M-46,-18 L-30,-28 L50,-28 L34,-18 Z" fill="url(#swTop)" stroke="#0d4f82" stroke-width="1"/>
      <rect x="-46" y="-18" width="80" height="30" fill="url(#swFront)"/>
      <path d="M34,-18 L50,-28 L50,2 L34,12 Z" fill="#0d4f82"/>
      <g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="-38" y1="-10" x2="-14" y2="-10" marker-end="url(#wa)"/>
        <line x1="26" y1="-10" x2="2" y2="-10" marker-end="url(#wa)"/>
        <line x1="-14" y1="3" x2="-38" y2="3" marker-end="url(#wa)"/>
        <line x1="2" y1="3" x2="26" y2="3" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="-32 -30 64 60" overflow="visible">
      <rect x="-30" y="-28" width="60" height="40" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-25" y="-23" width="50" height="30" fill="#cfe1f2"/>
      <rect x="-5" y="12" width="10" height="8" fill="#4a5866"/>
      <rect x="-18" y="20" width="36" height="5" rx="2" fill="#4a5866"/>
    </symbol>
  </defs>

<rect x="0" y="0" width="1060" height="205" fill="#fff"/>
  <line x1="90" y1="100" x2="164" y2="100" stroke="#4a5866" stroke-width="2.5"/>
  <line x1="260" y1="100" x2="324" y2="100" stroke="#1f7fc4" stroke-width="6" stroke-linecap="round"/>
  <text x="292.0" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f7fc4">10 ms</text>
  <line x1="420" y1="100" x2="484" y2="100" stroke="#1f7fc4" stroke-width="6" stroke-linecap="round"/>
  <text x="452.0" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f7fc4">10 ms</text>
  <line x1="580" y1="100" x2="644" y2="100" stroke="#1f7fc4" stroke-width="6" stroke-linecap="round"/>
  <text x="612.0" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f7fc4">10 ms</text>
  <line x1="740" y1="100" x2="804" y2="100" stroke="#1f7fc4" stroke-width="6" stroke-linecap="round"/>
  <text x="772.0" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f7fc4">10 ms</text>
  <line x1="900" y1="100" x2="970" y2="100" stroke="#4a5866" stroke-width="2.5"/>
  <use xlink:href="#pc" x="28" y="70" width="64" height="60"/>
  <text x="60" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">h1</text>
  <text x="60" y="145" text-anchor="middle" font-size="11" fill="#1f7fc4">10.0.0.1</text>
  <use xlink:href="#switch" x="155" y="70" width="110" height="60"/>
  <text x="210" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s1</text>
  <use xlink:href="#switch" x="315" y="70" width="110" height="60"/>
  <text x="370" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s2</text>
  <use xlink:href="#switch" x="475" y="70" width="110" height="60"/>
  <text x="530" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s3</text>
  <use xlink:href="#switch" x="635" y="70" width="110" height="60"/>
  <text x="690" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s4</text>
  <use xlink:href="#switch" x="795" y="70" width="110" height="60"/>
  <text x="850" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s5</text>
  <use xlink:href="#pc" x="968" y="70" width="64" height="60"/>
  <text x="1000" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">h2</text>
  <text x="1000" y="145" text-anchor="middle" font-size="11" fill="#1f7fc4">10.0.0.2</text>
  <line x1="260" y1="168" x2="804" y2="168" stroke="#4a5866" stroke-width="1.5" marker-start="url(#ga)" marker-end="url(#ga)"/>
  <text x="530" y="190" text-anchor="middle" font-size="12" fill="#1f2a33">4 links x 10 ms per direction: RTT about 2 x 4 x 10 = 80 ms</text>
</svg>
