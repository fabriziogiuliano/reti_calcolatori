  <text x="300" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s1</text>
  <g font-size="11" fill="#1f7fc4">
    <text x="240" y="126">1</text>
    <text x="356" y="126">2</text>
  </g>

  <!-- h2 -->
  <use xlink:href="#pc" x="448" y="80" width="64" height="60"/>
  <text x="480" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">h2</text>
  <text x="480" y="155" text-anchor="middle" font-size="11" fill="#1f7fc4">10.0.0.2</text>
