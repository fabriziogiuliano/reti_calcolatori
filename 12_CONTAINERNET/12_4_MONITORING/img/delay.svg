<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <title>Delay of a link measured with a probe</title>
  <defs>
    <linearGradient id="swTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#2585c9"/></linearGradient>
    <linearGradient id="swFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/></linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker>
    <symbol id="switch" viewBox="-55 -30 110 60" overflow="visible">
      <path d="M-46,-18 L-30,-28 L50,-28 L34,-18 Z" fill="url(#swTop)" stroke="#0d4f82" stroke-width="1"/>
      <rect x="-46" y="-18" width="80" height="30" fill="url(#swFront)"/>
      <path d="M34,-18 L50,-28 L50,2 L34,12 Z" fill="#0d4f82"/>
      <g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="-38" y1="-10" x2="-14" y2="-10" marker-end="url(#wa)"/>
        <line x1="26" y1="-10" x2="2" y2="-10" marker-end="url(#wa)"/>
        <line x1="-14" y1="3" x2="-38" y2="3" marker-end="url(#wa)"/>
        <line x1="2" y1="3" x2="26" y2="3" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="-32 -30 64 60" overflow="visible">
      <rect x="-30" y="-28" width="60" height="40" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-25" y="-23" width="50" height="30" fill="#cfe1f2"/>
      <rect x="-5" y="12" width="10" height="8" fill="#4a5866"/>
      <rect x="-18" y="20" width="36" height="5" rx="2" fill="#4a5866"/>
    </symbol>
    <symbol id="server" viewBox="-26 -36 52 72" overflow="visible">
      <rect x="-24" y="-34" width="48" height="68" rx="4" fill="#4a5866"/>
      <g fill="#7d8b98"><rect x="-18" y="-26" width="36" height="5" rx="1"/><rect x="-18" y="-16" width="36" height="5" rx="1"/><rect x="-18" y="-6" width="36" height="5" rx="1"/></g>
      <circle cx="12" cy="22" r="3" fill="#6cc04a"/>
    </symbol>
  </defs>
  <rect width="1000" height="380" fill="#fff"/>
  <use xlink:href="#server" x="474" y="16" width="52" height="72"/>
  <text x="500" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a33">controller</text>
  <line x1="410" y1="290" x2="590" y2="290" stroke="#4a5866" stroke-width="2.5"/>
  <use xlink:href="#switch" x="305" y="260" width="110" height="60"/>
  <use xlink:href="#switch" x="585" y="260" width="110" height="60"/>
  <g font-size="16" font-weight="bold" fill="#1f2a33" text-anchor="middle"><text x="357" y="346">s1</text><text x="637" y="346">s2</text></g>
  <g font-size="11" fill="#1f7fc4"><text x="412" y="310">2</text><text x="576" y="310">1</text></g>

  <g stroke="#e08a1e" stroke-width="2.5" fill="none">
    <path d="M462,124 L372,248" marker-end="url(#oa)"/>
    <path d="M424,276 L576,276" marker-end="url(#oa)"/>
    <path d="M628,248 L538,124" marker-end="url(#oa)"/>
  </g>
  <defs><marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="395" cy="165" r="13" fill="#e08a1e"/><text x="395" y="170">1</text>
    <circle cx="500" cy="255" r="13" fill="#e08a1e"/><text x="500" y="260">2</text>
    <circle cx="605" cy="165" r="13" fill="#e08a1e"/><text x="605" y="170">3</text>
  </g>
  <g font-size="12" fill="#1f2a33">
    <text x="60" y="150">PACKET_OUT from s1, port 2</text>
    <text x="60" y="168" fill="#6b7783">probe: "s1 port 2 at 12:00:00.000"</text>
    <text x="440" y="235" fill="#6b7783">the link: 5 ms</text>
    <text x="660" y="150">PACKET_IN from s2, port 1</text>
    <text x="660" y="168" fill="#6b7783">arrives at 12:00:00.006</text>
  </g>
  <rect x="660" y="190" width="300" height="64" rx="8" fill="#f5f7f9" stroke="#d5dbe1"/>
  <text x="676" y="214" font-size="13" fill="#1f2a33">delay = arrival − departure</text>
  <text x="676" y="240" font-size="13" fill="#1f2a33">= .006 − .000 = <tspan font-weight="bold" fill="#1f7fc4">6 ms</tspan></text>
</svg>
