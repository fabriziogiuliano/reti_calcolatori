<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 330" font-family="Helvetica, Arial, sans-serif">
  <title>Topology: h1 - s1 - s2 - s3 - h2 and the controller</title>
  <defs>
    <linearGradient id="swTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#2585c9"/></linearGradient>
    <linearGradient id="swFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/></linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker>
    <symbol id="switch" viewBox="-55 -30 110 60" overflow="visible">
      <path d="M-46,-18 L-30,-28 L50,-28 L34,-18 Z" fill="url(#swTop)" stroke="#0d4f82" stroke-width="1"/>
      <rect x="-46" y="-18" width="80" height="30" fill="url(#swFront)"/>
      <path d="M34,-18 L50,-28 L50,2 L34,12 Z" fill="#0d4f82"/>
      <g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="-38" y1="-10" x2="-14" y2="-10" marker-end="url(#wa)"/>
        <line x1="26" y1="-10" x2="2" y2="-10" marker-end="url(#wa)"/>
        <line x1="-14" y1="3" x2="-38" y2="3" marker-end="url(#wa)"/>
        <line x1="2" y1="3" x2="26" y2="3" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="-32 -30 64 60" overflow="visible">
      <rect x="-30" y="-28" width="60" height="40" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-25" y="-23" width="50" height="30" fill="#cfe1f2"/>
      <rect x="-5" y="12" width="10" height="8" fill="#4a5866"/>
      <rect x="-18" y="20" width="36" height="5" rx="2" fill="#4a5866"/>
    </symbol>
    <symbol id="server" viewBox="-26 -36 52 72" overflow="visible">
      <rect x="-24" y="-34" width="48" height="68" rx="4" fill="#4a5866"/>
      <g fill="#7d8b98"><rect x="-18" y="-26" width="36" height="5" rx="1"/><rect x="-18" y="-16" width="36" height="5" rx="1"/><rect x="-18" y="-6" width="36" height="5" rx="1"/></g>
      <circle cx="12" cy="22" r="3" fill="#6cc04a"/>
    </symbol>
  </defs>
  <rect width="1000" height="330" fill="#fff"/>
  <use xlink:href="#server" x="474" y="20" width="52" height="72"/>
  <text x="500" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a33">controller (os-ken)</text>
  <g stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <path d="M460,128 L290,222"/><path d="M500,130 L500,218"/><path d="M540,128 L710,222"/>
  </g>
  <text x="508" y="200" font-size="11" fill="#8a96a3">OpenFlow 1.3, TCP 6653</text>
  <g stroke="#4a5866" stroke-width="2.5">
    <line x1="112" y1="252" x2="240" y2="252"/><line x1="340" y1="252" x2="450" y2="252"/>
    <line x1="550" y1="252" x2="660" y2="252"/><line x1="760" y1="252" x2="888" y2="252"/>
  </g>
  <use xlink:href="#pc" x="48" y="222" width="64" height="60"/>
  <use xlink:href="#switch" x="235" y="222" width="110" height="60"/>
  <use xlink:href="#switch" x="445" y="222" width="110" height="60"/>
  <use xlink:href="#switch" x="655" y="222" width="110" height="60"/>
  <use xlink:href="#pc" x="888" y="222" width="64" height="60"/>
  <g font-size="16" font-weight="bold" fill="#1f2a33" text-anchor="middle">
    <text x="80" y="308">h1</text><text x="287" y="308">s1</text><text x="497" y="308">s2</text><text x="707" y="308">s3</text><text x="920" y="308">h2</text>
  </g>
  <g font-size="12" fill="#6b7783" text-anchor="middle">
    <text x="80" y="324">10.0.0.1</text><text x="920" y="324">10.0.0.2</text>
    <text x="395" y="240">10 Mbit/s · 5 ms</text><text x="605" y="240">20 Mbit/s · 10 ms</text>
  </g>
  <g font-size="11" fill="#1f7fc4">
    <text x="226" y="272">1</text><text x="342" y="272">2</text><text x="436" y="272">1</text><text x="552" y="272">2</text><text x="646" y="272">1</text><text x="762" y="272">2</text>
  </g>
</svg>
