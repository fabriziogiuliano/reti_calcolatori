frr defaults traditional
hostname r2
log stdout informational
service integrated-vtysh-config
!
interface r2-eth1
 description to r1 (10.0.12.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
interface r2-eth2
 description to r3 (10.0.23.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r2-eth3
 description to r4 (10.0.24.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 5
!
router ospf
 ospf router-id 2.2.2.2
!
line vty
!
