<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 222" font-family="Helvetica, Arial, sans-serif">
  <title>Three terminals: the network, h2 (iperf server), h1 (iperf client)</title>
  <defs>
    <linearGradient id="swTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#2585c9"/></linearGradient>
    <linearGradient id="swFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/></linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7fc4"/></marker>
    <symbol id="switch" viewBox="-55 -30 110 60" overflow="visible">
      <path d="M-46,-18 L-30,-28 L50,-28 L34,-18 Z" fill="url(#swTop)" stroke="#0d4f82" stroke-width="1"/>
      <rect x="-46" y="-18" width="80" height="30" fill="url(#swFront)"/>
      <path d="M34,-18 L50,-28 L50,2 L34,12 Z" fill="#0d4f82"/>
      <g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="-38" y1="-10" x2="-14" y2="-10" marker-end="url(#wa)"/>
        <line x1="26" y1="-10" x2="2" y2="-10" marker-end="url(#wa)"/>
        <line x1="-14" y1="3" x2="-38" y2="3" marker-end="url(#wa)"/>
        <line x1="2" y1="3" x2="26" y2="3" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="-32 -30 64 60" overflow="visible">
      <rect x="-30" y="-28" width="60" height="40" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-25" y="-23" width="50" height="30" fill="#cfe1f2"/>
      <rect x="-5" y="12" width="10" height="8" fill="#4a5866"/>
      <rect x="-18" y="20" width="36" height="5" rx="2" fill="#4a5866"/>
    </symbol>
  </defs>

<rect x="0" y="0" width="980" height="222" fill="#fff"/>
  <rect x="20" y="20" width="300" height="130" rx="6" fill="#1e252b" stroke="#4a5866" stroke-width="1.5"/>
  <rect x="20" y="20" width="300" height="26" rx="6" fill="#e9edf1"/>
  <rect x="20" y="36" width="300" height="10" fill="#e9edf1"/>
  <text x="32" y="38" font-size="13" font-weight="bold" fill="#1f2a33">Terminal 1: the network</text>
  <text x="32" y="70" font-family="Menlo, Courier New, monospace" font-size="12" fill="#e6e9ef">$ sudo ... 01-chain.py</text>
  <text x="32" y="90" font-family="Menlo, Courier New, monospace" font-size="12" fill="#7ed99c">containernet></text>
  <text x="32" y="110" font-family="Menlo, Courier New, monospace" font-size="12" fill="#8a96a8">(leave it open)</text>
  <rect x="340" y="20" width="300" height="130" rx="6" fill="#1e252b" stroke="#4a5866" stroke-width="1.5"/>
  <rect x="340" y="20" width="300" height="26" rx="6" fill="#e9edf1"/>
  <rect x="340" y="36" width="300" height="10" fill="#e9edf1"/>
  <text x="352" y="38" font-size="13" font-weight="bold" fill="#1f7fc4">Terminal 2: inside h2</text>
  <text x="352" y="70" font-family="Menlo, Courier New, monospace" font-size="12" fill="#e6e9ef">$ sudo mnexec -a $(pgrep -f</text>
  <text x="352" y="90" font-family="Menlo, Courier New, monospace" font-size="12" fill="#e6e9ef">    "mininet:h2$") bash</text>
  <text x="352" y="110" font-family="Menlo, Courier New, monospace" font-size="12" fill="#7ed99c"># iperf -s -i 1</text>
  <rect x="660" y="20" width="300" height="130" rx="6" fill="#1e252b" stroke="#4a5866" stroke-width="1.5"/>
  <rect x="660" y="20" width="300" height="26" rx="6" fill="#e9edf1"/>
  <rect x="660" y="36" width="300" height="10" fill="#e9edf1"/>
  <text x="672" y="38" font-size="13" font-weight="bold" fill="#1f7fc4">Terminal 3: inside h1</text>
  <text x="672" y="70" font-family="Menlo, Courier New, monospace" font-size="12" fill="#e6e9ef">$ sudo mnexec -a $(pgrep -f</text>
  <text x="672" y="90" font-family="Menlo, Courier New, monospace" font-size="12" fill="#e6e9ef">    "mininet:h1$") bash</text>
  <text x="672" y="110" font-family="Menlo, Courier New, monospace" font-size="12" fill="#7ed99c"># iperf -c 10.0.0.2</text>
  <path d="M 810 160 C 810 200, 490 200, 490 162" fill="none" stroke="#1f7fc4" stroke-width="2.5" marker-end="url(#ba)"/>
  <text x="650" y="208" text-anchor="middle" font-size="12" fill="#1f7fc4">data: client h1 → server h2</text>
</svg>
