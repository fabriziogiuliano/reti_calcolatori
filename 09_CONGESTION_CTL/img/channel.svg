<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#fff"/>

  <!-- endpoints -->
  <rect x="30" y="80" width="130" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="95" y="135" text-anchor="middle" font-size="16" font-weight="bold">Client</text>
  <text x="95" y="156" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">cwnd_client.py</text>

  <rect x="700" y="80" width="130" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="765" y="135" text-anchor="middle" font-size="16" font-weight="bold">Server</text>
  <text x="765" y="156" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">tcp_server.py</text>

  <!-- emulated channel -->
  <rect x="200" y="45" width="460" height="175" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="212" y="66" font-weight="bold">Emulated channel <tspan font-weight="normal" fill="#555">(tc netem / dummynet)</tspan></text>

  <!-- data path: client -> queue -> link -> server -->
  <line x1="160" y1="110" x2="290" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="102" text-anchor="middle" font-style="italic">data</text>
  <!-- queue: open on the left, slots -->
  <path d="M290,94 H390 V126 H290" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <line x1="350" y1="94" x2="350" y2="126" stroke="#000" stroke-width="1"/>
  <line x1="360" y1="94" x2="360" y2="126" stroke="#000" stroke-width="1"/>
  <line x1="370" y1="94" x2="370" y2="126" stroke="#000" stroke-width="1"/>
  <line x1="380" y1="94" x2="380" y2="126" stroke="#000" stroke-width="1"/>
  <text x="340" y="145" text-anchor="middle" font-size="12">Queue, 50 packets</text>
  <text x="340" y="86" text-anchor="middle" font-size="12" font-style="italic">full: drop</text>
  <line x1="390" y1="110" x2="440" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="92" width="140" height="36" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="510" y="115" text-anchor="middle">Link, 10 Mbit/s</text>
  <line x1="580" y1="110" x2="700" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ACK path: server -> delay -> client -->
  <line x1="700" y1="190" x2="580" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="182" text-anchor="middle" font-style="italic">ACK</text>
  <rect x="440" y="172" width="140" height="36" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="510" y="195" text-anchor="middle">Delay, 100 ms</text>
  <line x1="440" y1="190" x2="160" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- client reads cwnd from its kernel -->
  <line x1="95" y1="200" x2="95" y2="250" stroke="#000" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="103" y="238" font-size="12" font-style="italic">cwnd from the kernel</text>
  <rect x="30" y="250" width="130" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="95" y="271" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">cwnd.csv</text>
</svg>
