<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <title>SDN: management, control and data plane</title>
  <defs>
    <linearGradient id="rtTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#1f7fc4"/>
    </linearGradient>
    <linearGradient id="rtSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/>
    </linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/>
    </marker>

    <symbol id="router" viewBox="-52 -30 104 64" overflow="visible">
      <path d="M-48,-8 v20 a48,17 0 0 0 96,0 v-20 z" fill="url(#rtSide)"/>
      <ellipse cx="0" cy="-8" rx="48" ry="17" fill="url(#rtTop)" stroke="#0d4f82" stroke-width="1"/>
      <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="-36" y1="-8" x2="-12" y2="-8" marker-end="url(#wa)"/>
        <line x1="36" y1="-8" x2="12" y2="-8" marker-end="url(#wa)"/>
        <line x1="-4" y1="-11" x2="-12" y2="-21" marker-end="url(#wa)"/>
        <line x1="4" y1="-5" x2="12" y2="5" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="server" viewBox="-26 -36 52 72" overflow="visible">
      <rect x="-24" y="-34" width="48" height="68" rx="4" fill="#4a5866"/>
      <g fill="#7d8b98">
        <rect x="-18" y="-26" width="36" height="5" rx="1"/>
        <rect x="-18" y="-16" width="36" height="5" rx="1"/>
        <rect x="-18" y="-6" width="36" height="5" rx="1"/>
      </g>
      <circle cx="12" cy="22" r="3" fill="#6cc04a"/>
    </symbol>
    <symbol id="laptop" viewBox="-40 -28 80 52" overflow="visible">
      <rect x="-28" y="-26" width="56" height="36" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-23" y="-21" width="46" height="26" fill="#1f2a33"/>
      <text x="-19" y="-6" font-family="Menlo, monospace" font-size="9" fill="#6cc04a">$ curl</text>
      <path d="M-38,12 h76 l-6,8 h-64 z" fill="#4a5866"/>
    </symbol>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- plane bands -->
  <g fill="#f5f7f9">
    <rect x="0" y="10" width="1000" height="120"/>
    <rect x="0" y="175" width="1000" height="120"/>
    <rect x="0" y="340" width="1000" height="120"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1f7fc4" letter-spacing="1">
    <text x="30" y="64">MANAGEMENT</text>
    <text x="30" y="229">CONTROL</text>
    <text x="30" y="394">DATA</text>
  </g>
  <g font-size="12" fill="#6b7783">
    <text x="30" y="84">what the network must do</text>
    <text x="30" y="249">how to do it: rules</text>
    <text x="30" y="414">forward the packets</text>
  </g>

  <!-- management -->
  <use xlink:href="#laptop" x="460" y="36" width="80" height="52"/>
  <text x="560" y="66" font-size="15" font-weight="bold" fill="#1f2a33">operator / scripts</text>
  <text x="560" y="86" font-size="12" fill="#6b7783">POST /router/&lt;dpid&gt; {"address": …}</text>

  <!-- northbound -->
  <line x1="500" y1="100" x2="500" y2="196" stroke="#4a5866" stroke-width="2" marker-end="url(#ga)"/>
  <text x="514" y="146" font-size="12" fill="#4a5866">REST API · northbound · HTTP 8080</text>

  <!-- control -->
  <use xlink:href="#server" x="474" y="199" width="52" height="72"/>
  <text x="550" y="228" font-size="15" font-weight="bold" fill="#1f2a33">SDN controller</text>
  <text x="550" y="248" font-size="12" fill="#6b7783">os-ken + rest_router.py: configuration, ARP table, routing</text>

  <!-- southbound -->
  <line x1="470" y1="276" x2="390" y2="362" stroke="#4a5866" stroke-width="2" marker-start="url(#ga)" marker-end="url(#ga)"/>
  <line x1="530" y1="276" x2="610" y2="362" stroke="#4a5866" stroke-width="2" marker-start="url(#ga)" marker-end="url(#ga)"/>
  <text x="640" y="306" font-size="12" fill="#4a5866">OpenFlow 1.3 · southbound · TCP 6653</text>
  <text x="640" y="324" font-size="12" fill="#6b7783">↓ FLOW_MOD, PACKET_OUT    ↑ PACKET_IN</text>

  <!-- data -->
  <line x1="408" y1="398" x2="592" y2="398" stroke="#4a5866" stroke-width="2.5"/>
  <use xlink:href="#router" x="308" y="372" width="104" height="64"/>
  <use xlink:href="#router" x="588" y="372" width="104" height="64"/>
  <text x="360" y="452" font-size="14" font-weight="bold" fill="#1f2a33" text-anchor="middle">s1</text>
  <text x="640" y="452" font-size="14" font-weight="bold" fill="#1f2a33" text-anchor="middle">s2</text>
  <text x="730" y="394" font-size="12" fill="#6b7783">flow table: match → actions</text>
  <text x="730" y="412" font-size="12" fill="#6b7783">no match → ask the controller</text>
</svg>
