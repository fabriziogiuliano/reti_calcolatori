frr defaults traditional
hostname r3
log stdout informational
service integrated-vtysh-config
!
interface r3-eth0
 description LAN of h2 (192.168.3.0/24)
 ip ospf area 0
 ip ospf passive
!
interface r3-eth1
 description to r2 (10.0.23.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r3-eth2
 description to r4 (10.0.34.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 30
!
router ospf
 ospf router-id 3.3.3.3
!
line vty
!
