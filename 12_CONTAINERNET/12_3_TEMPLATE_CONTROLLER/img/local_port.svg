<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <title>The internal port (LOCAL) of a switch: unused in the lab, used on servers</title>
  <defs>
    <linearGradient id="swTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#2585c9"/></linearGradient>
    <linearGradient id="swFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/></linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker>
    <symbol id="switch" viewBox="-55 -30 110 60" overflow="visible">
      <path d="M-46,-18 L-30,-28 L50,-28 L34,-18 Z" fill="url(#swTop)" stroke="#0d4f82" stroke-width="1"/>
      <rect x="-46" y="-18" width="80" height="30" fill="url(#swFront)"/>
      <path d="M34,-18 L50,-28 L50,2 L34,12 Z" fill="#0d4f82"/>
      <g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="-38" y1="-10" x2="-14" y2="-10" marker-end="url(#wa)"/>
        <line x1="26" y1="-10" x2="2" y2="-10" marker-end="url(#wa)"/>
        <line x1="-14" y1="3" x2="-38" y2="3" marker-end="url(#wa)"/>
        <line x1="2" y1="3" x2="26" y2="3" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="-32 -30 64 60" overflow="visible">
      <rect x="-30" y="-28" width="60" height="40" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-25" y="-23" width="50" height="30" fill="#cfe1f2"/>
      <rect x="-5" y="12" width="10" height="8" fill="#4a5866"/>
      <rect x="-18" y="20" width="36" height="5" rx="2" fill="#4a5866"/>
    </symbol>
    <symbol id="server" viewBox="-26 -36 52 72" overflow="visible">
      <rect x="-24" y="-34" width="48" height="68" rx="4" fill="#4a5866"/>
      <g fill="#7d8b98"><rect x="-18" y="-26" width="36" height="5" rx="1"/><rect x="-18" y="-16" width="36" height="5" rx="1"/><rect x="-18" y="-6" width="36" height="5" rx="1"/></g>
      <circle cx="12" cy="22" r="3" fill="#6cc04a"/>
    </symbol>
  </defs>
  <rect width="1000" height="440" fill="#fff"/>

  <!-- panel titles -->
  <text x="250" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a33">In this lab</text>
  <text x="250" y="52" text-anchor="middle" font-size="12" fill="#6b7783">LOCAL exists, nobody uses it</text>
  <text x="750" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a33">On a server with Open vSwitch</text>
  <text x="750" y="52" text-anchor="middle" font-size="12" fill="#6b7783">LOCAL carries the traffic of the server itself</text>
  <line x1="500" y1="20" x2="500" y2="420" stroke="#e1e6eb" stroke-width="1.5"/>

  <!-- ===== left: the lab ===== -->
  <rect x="40" y="250" width="420" height="160" rx="10" fill="#f5f7f9" stroke="#d5dbe1"/>
  <text x="56" y="272" font-size="12" fill="#6b7783">the machine that runs s1 (the VM)</text>
  <use xlink:href="#server" x="214" y="300" width="52" height="72"/>
  <text x="240" y="394" text-anchor="middle" font-size="12" fill="#1f2a33">controller</text>
  <line x1="68" y1="160" x2="190" y2="160" stroke="#4a5866" stroke-width="2.5"/>
  <line x1="300" y1="160" x2="420" y2="160" stroke="#4a5866" stroke-width="2.5"/>
  <use xlink:href="#switch" x="185" y="130" width="110" height="60"/>
  <text x="68" y="150" font-size="12" fill="#1f2a33">h1</text><text x="400" y="150" font-size="12" fill="#1f2a33">s2</text>
  <g font-size="11" fill="#1f7fc4"><text x="176" y="180">1</text><text x="302" y="180">2</text></g>
  <text x="240" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">s1</text>
  <!-- LOCAL unused -->
  <line x1="225" y1="182" x2="225" y2="250" stroke="#b9c2cb" stroke-width="2.5" stroke-dasharray="3 4"/>
  <text x="150" y="222" font-size="12" fill="#8a96a3">LOCAL</text>
  <text x="150" y="238" font-size="11" fill="#8a96a3">0 bytes</text>
  <!-- controller via TCP -->
  <path d="M262,300 C330,260 320,210 282,186" fill="none" stroke="#7b4aa8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pa)"/>
  <defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b4aa8"/></marker></defs>
  <text x="330" y="230" font-size="11" fill="#7b4aa8">OpenFlow over TCP,</text>
  <text x="330" y="245" font-size="11" fill="#7b4aa8">not through the ports</text>

  <!-- ===== right: server with OVS ===== -->
  <rect x="540" y="250" width="420" height="160" rx="10" fill="#f5f7f9" stroke="#d5dbe1"/>
  <text x="556" y="398" font-size="12" fill="#6b7783">the server that runs the bridge</text>
  <rect x="690" y="300" width="120" height="62" rx="8" fill="#fff" stroke="#4a5866" stroke-width="2"/>
  <text x="750" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2a33">server OS</text>
  <text x="750" y="342" text-anchor="middle" font-size="11" fill="#6b7783">SSH, storage, mgmt</text>
  <text x="750" y="356" text-anchor="middle" font-size="11" fill="#1f7fc4">IP 192.0.2.10</text>
  <use xlink:href="#switch" x="695" y="130" width="110" height="60"/>
  <text x="750" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a33">br-ex</text>
  <line x1="568" y1="160" x2="700" y2="160" stroke="#4a5866" stroke-width="2.5"/>
  <line x1="810" y1="160" x2="932" y2="160" stroke="#4a5866" stroke-width="2.5"/>
  <text x="560" y="150" font-size="12" fill="#1f2a33">physical NIC</text>
  <text x="560" y="182" font-size="11" fill="#6b7783">to the network</text>
  <text x="880" y="150" font-size="12" fill="#1f2a33">VMs</text>
  <!-- LOCAL used -->
  <line x1="735" y1="182" x2="735" y2="300" stroke="#e08a1e" stroke-width="3"/>
  <text x="745" y="222" font-size="12" font-weight="bold" fill="#b8650a">LOCAL</text>
  <text x="745" y="238" font-size="11" fill="#b8650a">traffic of the server</text>
</svg>
