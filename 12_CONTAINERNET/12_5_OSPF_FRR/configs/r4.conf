frr defaults traditional
hostname r4
log stdout informational
service integrated-vtysh-config
!
interface r4-eth1
 description to r1 (10.0.14.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 5
!
interface r4-eth2
 description to r2 (10.0.24.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 5
!
interface r4-eth3
 description to r3 (10.0.34.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 30
!
router ospf
 ospf router-id 4.4.4.4
!
line vty
!
