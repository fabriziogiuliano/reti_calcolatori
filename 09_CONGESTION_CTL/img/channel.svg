<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="860" height="340" fill="#fff"/>

  <!-- endpoints -->
  <rect x="30" y="80" width="130" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="95" y="150" text-anchor="middle" font-size="16" font-weight="bold">Client</text>
  <text x="95" y="171" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">cwnd_client.py</text>

  <rect x="700" y="80" width="130" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="765" y="150" text-anchor="middle" font-size="16" font-weight="bold">Server</text>
  <text x="765" y="171" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">tcp_server.py</text>

  <!-- emulated channel -->
  <rect x="200" y="45" width="460" height="205" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="212" y="66" font-weight="bold">Emulated channel <tspan font-weight="normal" fill="#555">(tc netem / dummynet)</tspan></text>

  <!-- data path: client -> router queue -> link -> server -->
  <line x1="160" y1="110" x2="235" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="178" y="102" text-anchor="middle" font-style="italic">data</text>
  <!-- queue: open on the left (packets enter), slots at the exit on the right -->
  <path d="M235,94 H335 V126 H235" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <line x1="295" y1="94" x2="295" y2="126" stroke="#000" stroke-width="1"/>
  <line x1="305" y1="94" x2="305" y2="126" stroke="#000" stroke-width="1"/>
  <line x1="315" y1="94" x2="315" y2="126" stroke="#000" stroke-width="1"/>
  <line x1="325" y1="94" x2="325" y2="126" stroke="#000" stroke-width="1"/>
  <text x="285" y="86" text-anchor="middle" font-size="12" font-style="italic">full: drop</text>
  <text x="285" y="145" text-anchor="middle" font-size="12">Router queue, 50 packets</text>
  <line x1="335" y1="110" x2="365" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="365" y="92" width="130" height="36" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="430" y="115" text-anchor="middle">Link, 10 Mbit/s</text>
  <line x1="495" y1="110" x2="700" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ACK path: server -> router queue -> link -> cable -> client -->
  <line x1="700" y1="200" x2="625" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="192" font-size="13" text-anchor="middle" font-style="italic">ACK</text>
  <!-- queue: open on the right (ACKs enter from the server), slots at the exit on the left -->
  <path d="M625,184 H525 V216 H625" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <line x1="535" y1="184" x2="535" y2="216" stroke="#000" stroke-width="1"/>
  <line x1="545" y1="184" x2="545" y2="216" stroke="#000" stroke-width="1"/>
  <line x1="555" y1="184" x2="555" y2="216" stroke="#000" stroke-width="1"/>
  <line x1="565" y1="184" x2="565" y2="216" stroke="#000" stroke-width="1"/>
  <text x="575" y="235" text-anchor="middle" font-size="12">Router queue, 50 packets</text>
  <line x1="525" y1="200" x2="495" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="365" y="182" width="130" height="36" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="430" y="205" text-anchor="middle">Link, 10 Mbit/s</text>
  <line x1="365" y1="200" x2="335" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="215" y="182" width="120" height="36" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="275" y="205" text-anchor="middle">Cable, 100 ms</text>
  <text x="275" y="235" text-anchor="middle" font-size="12" fill="#555">room ≈ 1500 packets</text>
  <line x1="215" y1="200" x2="160" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- client reads cwnd from its kernel -->
  <line x1="95" y1="230" x2="95" y2="292" stroke="#000" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="103" y="280" font-size="12" font-style="italic">cwnd from the kernel</text>
  <rect x="30" y="292" width="130" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="95" y="313" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace">cwnd.csv</text>
</svg>
