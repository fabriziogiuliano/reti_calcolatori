frr defaults traditional
hostname r1
log stdout informational
service integrated-vtysh-config
!
interface r1-eth0
 description LAN of h1 (192.168.1.0/24)
 ip ospf area 0
 ip ospf passive
!
interface r1-eth1
 description to r2 (10.0.12.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
interface r1-eth2
 description to r4 (10.0.14.0/24)
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 5
!
router ospf
 ospf router-id 1.1.1.1
!
line vty
!
