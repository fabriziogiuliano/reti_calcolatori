<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <title>OSPF lab topology: four FRRouting routers, link costs</title>
  <defs>
    <linearGradient id="rtTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9ad9"/><stop offset="1" stop-color="#1f7fc4"/>
    </linearGradient>
    <linearGradient id="rtSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1667a3"/><stop offset="1" stop-color="#0d4f82"/>
    </linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <symbol id="router" viewBox="-52 -30 104 64" overflow="visible">
      <path d="M-48,-8 v20 a48,17 0 0 0 96,0 v-20 z" fill="url(#rtSide)"/>
      <ellipse cx="0" cy="-8" rx="48" ry="17" fill="url(#rtTop)" stroke="#0d4f82" stroke-width="1"/>
      <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="-36" y1="-8" x2="-12" y2="-8" marker-end="url(#wa)"/>
        <line x1="36" y1="-8" x2="12" y2="-8" marker-end="url(#wa)"/>
        <line x1="-4" y1="-11" x2="-12" y2="-21" marker-end="url(#wa)"/>
        <line x1="4" y1="-5" x2="12" y2="5" marker-end="url(#wa)"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="-32 -30 64 60" overflow="visible">
      <rect x="-30" y="-28" width="60" height="40" rx="3" fill="#eef2f5" stroke="#4a5866" stroke-width="2"/>
      <rect x="-25" y="-23" width="50" height="30" fill="#cfe1f2"/>
      <rect x="-5" y="12" width="10" height="8" fill="#4a5866"/>
      <rect x="-18" y="20" width="36" height="5" rx="2" fill="#4a5866"/>
    </symbol>
  </defs>

  <rect width="1000" height="420" fill="#ffffff"/>

  <!-- links -->
  <g stroke="#4a5866" stroke-width="2.5">
    <line x1="112" y1="120" x2="212" y2="120"/>
    <line x1="308" y1="120" x2="452" y2="120"/>
    <line x1="548" y1="120" x2="692" y2="120"/>
    <line x1="788" y1="120" x2="888" y2="120"/>
    <line x1="270" y1="142" x2="470" y2="312"/>
    <line x1="500" y1="146" x2="500" y2="300"/>
    <line x1="730" y1="142" x2="530" y2="312"/>
  </g>

  <!-- costs -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="360" y="105" width="40" height="26" rx="13" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
    <text x="380" y="123" fill="#b8650a">20</text>
    <rect x="600" y="105" width="40" height="26" rx="13" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
    <text x="620" y="123" fill="#b8650a">10</text>
    <rect x="350" y="214" width="40" height="26" rx="13" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
    <text x="370" y="232" fill="#b8650a">5</text>
    <rect x="480" y="210" width="40" height="26" rx="13" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
    <text x="500" y="228" fill="#b8650a">5</text>
    <rect x="610" y="214" width="40" height="26" rx="13" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
    <text x="630" y="232" fill="#b8650a">30</text>
  </g>

  <!-- subnets -->
  <g font-size="11" fill="#8a96a3" text-anchor="middle">
    <text x="162" y="104">192.168.1.0/24</text>
    <text x="380" y="152">10.0.12.0/24</text>
    <text x="620" y="152">10.0.23.0/24</text>
    <text x="838" y="104">192.168.3.0/24</text>
    <text x="318" y="262">10.0.14.0/24</text>
    <text x="510" y="188" text-anchor="start">10.0.24.0/24</text>
    <text x="684" y="262">10.0.34.0/24</text>
  </g>

  <!-- nodes -->
  <use xlink:href="#pc" x="48" y="90" width="64" height="60"/>
  <use xlink:href="#router" x="208" y="94" width="104" height="64"/>
  <use xlink:href="#router" x="448" y="94" width="104" height="64"/>
  <use xlink:href="#router" x="688" y="94" width="104" height="64"/>
  <use xlink:href="#pc" x="888" y="90" width="64" height="60"/>
  <use xlink:href="#router" x="448" y="304" width="104" height="64"/>

  <g font-size="16" font-weight="bold" fill="#1f2a33" text-anchor="middle">
    <text x="80" y="176">h1</text>
    <text x="260" y="70">r1</text>
    <text x="500" y="70">r2</text>
    <text x="740" y="70">r3</text>
    <text x="920" y="176">h2</text>
    <text x="500" y="396">r4</text>
  </g>
  <g font-size="11" fill="#6b7783" text-anchor="middle">
    <text x="80" y="192">.10</text>
    <text x="260" y="54">router-id 1.1.1.1</text>
    <text x="500" y="54">router-id 2.2.2.2</text>
    <text x="740" y="54">router-id 3.3.3.3</text>
    <text x="920" y="192">.10</text>
    <text x="500" y="412">router-id 4.4.4.4</text>
  </g>

  <!-- legend -->
  <rect x="790" y="330" width="40" height="22" rx="11" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
  <text x="840" y="346" font-size="12" fill="#6b7783">OSPF cost of the link</text>
  <text x="790" y="374" font-size="12" fill="#6b7783">OSPF area 0 everywhere</text>
</svg>
